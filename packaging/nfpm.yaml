# nfpm configuration for the .deb, built with `make package` (see Makefile).
# The modules stay flat in /usr/lib/aptfleet (private directory, not a
# Python package); /usr/bin only contains small shims.
name: aptfleet
arch: all
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Michele Catalano <michele@catalano.de>
homepage: https://github.com/ironpinguin/aptfleet
license: Apache-2.0
description: |
  Report pending Ubuntu updates with CVE and CISA KEV info
  aptfleet checks the local machine (--local) or hosts via SSH for pending
  deb updates, fixed CVEs, actively exploited vulnerabilities (KEV) and open
  vulnerabilities with no fix available yet. aptfleet-mail mails the report,
  e.g. daily from a cron job.

depends:
  - python3 (>= 3.9)
  - bash
recommends:
  - ca-certificates
  - openssh-client
suggests:
  - curl
  - default-mta | mail-transport-agent

contents:
  # Modes as in the repo: aptfleet.py 0755, the other modules 0644
  - src: ./*.py
    dst: /usr/lib/aptfleet/
  - src: ./cron/aptfleet-mail.sh
    dst: /usr/lib/aptfleet/cron/aptfleet-mail.sh
    file_info:
      mode: 0755

  - src: ./packaging/aptfleet
    dst: /usr/bin/aptfleet
    file_info:
      mode: 0755
  - src: ./packaging/aptfleet-mail
    dst: /usr/bin/aptfleet-mail
    file_info:
      mode: 0755

  - src: ./cron/mail.env.sample
    dst: /etc/aptfleet/mail.env
    type: config|noreplace
    file_info:
      mode: 0600
  - src: ./packaging/aptfleet.cron
    dst: /etc/cron.d/aptfleet
    type: config|noreplace
    file_info:
      mode: 0644
  - dst: /etc/aptfleet
    type: dir
    file_info:
      mode: 0755

  - src: ./README.md
    dst: /usr/share/doc/aptfleet/README.md
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/aptfleet/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinst
  preremove: ./packaging/prerm
