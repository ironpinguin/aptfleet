# nfpm-Konfiguration für das .deb, gebaut mit `make package` (siehe Makefile).
# Die Module bleiben flach in /usr/lib/aptfleet (privates Verzeichnis, kein
# Python-Paket); /usr/bin enthält nur kleine Shims.
name: aptfleet
arch: all
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Michele Catalano <michele@catalano.de>
description: |
  Report über anstehende Ubuntu-Updates mit CVE- und CISA-KEV-Infos
  aptfleet prüft den eigenen Rechner (--local) oder Hosts per SSH auf
  anstehende deb-Updates, behobene CVEs, aktiv ausgenutzte Lücken (KEV) und
  offene Lücken ohne Fix. aptfleet-mail verschickt den Report per Mail,
  z. B. täglich per Cronjob.

depends:
  - python3 (>= 3.9)
  - bash
recommends:
  - ca-certificates
  - openssh-client
suggests:
  - curl
  - default-mta | mail-transport-agent

contents:
  # Modi wie im Repo: aptfleet.py 0755, die übrigen Module 0644
  - src: ./*.py
    dst: /usr/lib/aptfleet/
  - src: ./cron/aptfleet-mail.sh
    dst: /usr/lib/aptfleet/cron/aptfleet-mail.sh
    file_info:
      mode: 0755

  - src: ./packaging/aptfleet
    dst: /usr/bin/aptfleet
    file_info:
      mode: 0755
  - src: ./packaging/aptfleet-mail
    dst: /usr/bin/aptfleet-mail
    file_info:
      mode: 0755

  - src: ./cron/mail.env.sample
    dst: /etc/aptfleet/mail.env
    type: config|noreplace
    file_info:
      mode: 0600
  - src: ./packaging/aptfleet.cron
    dst: /etc/cron.d/aptfleet
    type: config|noreplace
    file_info:
      mode: 0644
  - dst: /etc/aptfleet
    type: dir
    file_info:
      mode: 0755

  - src: ./README.md
    dst: /usr/share/doc/aptfleet/README.md
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinst
  preremove: ./packaging/prerm
