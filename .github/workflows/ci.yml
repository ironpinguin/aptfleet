# CI: unit tests on every supported Python version, shellcheck, .deb build.
# On a SemVer tag (vX.Y.Z) the .deb is built with that version and attached to
# a GitHub Release.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: make test

  # Oldest supported Python. setup-python has no 3.9 build for the current
  # runner image, so this runs in the official Python image instead.
  test-python39:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -t .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck cron/aptfleet-mail.sh packaging/aptfleet packaging/aptfleet-mail packaging/postinst packaging/prerm

  package:
    needs: [test, test-python39, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag (or 0.0.0+<sha> for untagged builds)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - run: make package
      - name: Install and smoke-test the package
        run: |
          sudo apt-get install -y ./dist/aptfleet_*_all.deb
          aptfleet --help >/dev/null
          aptfleet --local --no-refresh || [ $? -le 3 ]
          sudo aptfleet-mail --dry-run >/dev/null || [ $? -le 3 ]
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          See the [changelog](https://github.com/$REPO/blob/$TAG/CHANGELOG.md) for everything in this release.

          Install: \`sudo apt install ./aptfleet_${TAG#v}_all.deb\`
          NOTES
          gh release create "$TAG" --repo "$REPO" --title "aptfleet $TAG" --notes-file notes.md dist/*.deb
